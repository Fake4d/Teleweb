<body>

	<div class="container pt-2">

		<div class="row pt-4">
			<div class="col-auto me-auto d-none d-sm-block">

			</div>

			<div class="col-auto ms-auto">
				<div class="btn-group btn-group-lg" role="group" aria-label="Steuerung">
					<button id="mute-video" type="button" class="btn btn-secondary" aria-label="Ton ein/aus" title="Ton ein/aus (M)">
						<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16" id="symbol-leise">
							<path d="M6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06m7.137 2.096a.5.5 0 0 1 0 .708L12.207 8l1.647 1.646a.5.5 0 0 1-.708.708L11.5 8.707l-1.646 1.647a.5.5 0 0 1-.708-.708L10.793 8 9.146 6.354a.5.5 0 1 1 .708-.708L11.5 7.293l1.646-1.647a.5.5 0 0 1 .708 0"/>
						</svg>
						<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16" id="symbol-laut" hidden>
							<path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/>
							<path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"/>
							<path d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/>
						</svg>
					</button>
					<button id="runter" type="button" class="btn btn-primary" aria-label="Sender zurück" title="Sender zurück (-)">
						<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">

						</svg>

				</div>
				<button id="PiPButton" type="button" class="btn btn-lg btn-primary" aria-label="Bild-in-Bild" title="Bild-in-Bild">
					<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">

						<path d="M8 8.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-.5.5h-5a.5.5 0 0 1-.5-.5z"/>

			<div class="col-1 d-none d-lg-block">
				<button id="fullscreen" type="button" class="btn btn-lg btn-primary" aria-label="Vollbild" title="Vollbild (F)">
					<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
						<path d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5M.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5m15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5"/>

		<div class="row pt-2">
			<div class="col-sm">
				<div class="collapse" id="SenderPanel">
					<div class="card bg-secondary">

		<div class="row pt-2 d-none d-lg-block">
			<div class="col-sm">
				<small class="text-body-secondary">Zappen: <kbd>+</kbd>/<kbd>-</kbd> | Ton: <kbd>M</kbd> | Vollbild: <kbd>F</kbd> | Sender: <kbd>S</kbd> | Externe Datenbank: <kbd><a href="https://iptv-org.github.io/" target="_blank" rel="noopener">IP-TV Org</a></kbd></small>

	<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js" integrity="sha384-cciJ0zi8d1uMKC2zJd7jvPY4HQt7W4ByUI/FlMkltvBi31aW61rcpVBhpmW8/NwX" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<script>
		document.getElementById('version').textContent = 'Teleweb ' + TelewebVersion;

		const video = document.getElementById('video');
		const senderPanel = document.getElementById('sender');
		const senderKnoepfe = [document.getElementById('senderknopf'), document.getElementById('senderknopf-sm')];
		const senderNamen = Object.keys(SenderListe);
		let senderIndex = 0;
		let hls = null;

		// Wiedergabeweg: hls.js (MSE) oder natives HLS (Safari / iOS). Falls hls.js nicht
		// geladen werden konnte (CDN nicht erreichbar), bleibt der native Weg übrig.
		const hlsJsVerfuegbar = typeof Hls !== 'undefined' && Hls.isSupported();
		const nativesHls = video.canPlayType('application/vnd.apple.mpegurl') !== '';
		if (!hlsJsVerfuegbar && !nativesHls) {
			document.getElementById('hinweis').hidden = false;
		}

		// localStorage kann fehlen oder gesperrt sein (privater Modus, Cookies blockiert)
		const speicher = {
			lesen(schluessel) { try { return localStorage.getItem(schluessel); } catch { return null; } },
			schreiben(schluessel, wert) { try { localStorage.setItem(schluessel, wert); } catch { /* ignorieren */ } }
		};

		// Senderknöpfe erzeugen
		senderNamen.forEach((name, i) => {
			const knopf = document.createElement('button');
			knopf.type = 'button';
			knopf.className = 'btn btn-primary btn-space me-1';
			knopf.textContent = name;
			knopf.dataset.index = i;
			knopf.setAttribute('aria-pressed', 'false');
			knopf.addEventListener('click', () => playTV(i));
			senderPanel.append(knopf, ' ');
		});

		function playTV(index) {
			senderIndex = (index + senderNamen.length) % senderNamen.length;
			const name = senderNamen[senderIndex];
			const url = SenderListe[name];

			if (hls) {
				hls.destroy();
				hls = null;
			}

			if (hlsJsVerfuegbar) {
				const instanz = new Hls();
				hls = instanz;
				instanz.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
				instanz.on(Hls.Events.ERROR, (event, data) => {
					// Nur die aktuell laufende Instanz behandeln, keine Nachzügler eines alten Senders
					if (!data.fatal || instanz !== hls) return;
					if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
						instanz.startLoad();
					} else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
						instanz.recoverMediaError();
					} else {
						instanz.destroy();
						hls = null;
					}
				});
				instanz.loadSource(url);
				instanz.attachMedia(video);
			} else if (nativesHls) {
				video.src = url;
				video.play().catch(() => {});
			}

			lauft(name);
			speicher.schreiben('teleweb-sender', name);
			if ('mediaSession' in navigator) {
				navigator.mediaSession.metadata = new MediaMetadata({ title: name, artist: 'Teleweb' });
			}
		}

		function lauft(name) {
			for (const knopf of senderPanel.children) {
				const aktiv = Number(knopf.dataset.index) === senderIndex;
				knopf.classList.toggle('active', aktiv);
				knopf.setAttribute('aria-pressed', String(aktiv));
			}
			senderKnoepfe.forEach((knopf) => { knopf.textContent = name; });
			document.title = name + ' – Teleweb';
		}

		function hochschalten() { playTV(senderIndex + 1); }
		function runterschalten() { playTV(senderIndex - 1); }

		function leise() {
			video.muted = !video.muted;
			tonAnzeigen();
		}

		// Ton-Anzeige immer aus dem Videozustand ableiten, damit sie auch stimmt,
		// wenn über die nativen Player-Bedienelemente stummgeschaltet wird.
		function tonAnzeigen() {
			const stumm = video.muted;
			document.getElementById('symbol-leise').hidden = !stumm;
			document.getElementById('symbol-laut').hidden = stumm;
			const knopf = document.getElementById('mute-video');
			knopf.classList.toggle('btn-primary', !stumm);
			knopf.classList.toggle('btn-secondary', stumm);
		}
		video.addEventListener('volumechange', tonAnzeigen);
		tonAnzeigen();

		function vollbild() {
			if (document.fullscreenElement || document.webkitFullscreenElement) {
				if (document.exitFullscreen) document.exitFullscreen();
				else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
			} else if (video.requestFullscreen) {
				video.requestFullscreen();
			} else if (video.webkitRequestFullscreen) {
				video.webkitRequestFullscreen();
			} else if (video.webkitEnterFullscreen) {
				// iPhone
				video.webkitEnterFullscreen();
			}
		}

		document.getElementById('hoch').addEventListener('click', hochschalten);
		document.getElementById('runter').addEventListener('click', runterschalten);
		document.getElementById('mute-video').addEventListener('click', leise);
		document.getElementById('fullscreen').addEventListener('click', vollbild);

		document.addEventListener('keydown', (e) => {
			// Browser-Kürzel wie Strg+F / Cmd+M nicht abfangen
			if (e.ctrlKey || e.metaKey || e.altKey) return;
			switch (e.key) {
				case '+': hochschalten(); break;
				case '-': runterschalten(); break;
				case 'm': case 'M': leise(); break;
				case 'f': case 'F': vollbild(); break;
				case 's': case 'S':
					bootstrap.Collapse.getOrCreateInstance(document.getElementById('SenderPanel')).toggle();
					break;
			}
		});

		// Medientasten (Tastatur, Kopfhörer, Sperrbildschirm) zappen ebenfalls
		if ('mediaSession' in navigator) {
			try {
				navigator.mediaSession.setActionHandler('nexttrack', hochschalten);
				navigator.mediaSession.setActionHandler('previoustrack', runterschalten);
			} catch { /* Aktion vom Browser nicht unterstützt */ }
		}

		// Bild-in-Bild: Standard-API (Chrome, Edge, Safari 17+) mit WebKit-Fallback (älteres Safari)
		const pipKnopf = document.getElementById('PiPButton');
		if (document.pictureInPictureEnabled) {
			pipKnopf.addEventListener('click', () => {
				if (document.pictureInPictureElement) {
					document.exitPictureInPicture();
				} else {
					video.requestPictureInPicture().catch(() => {});
				}
			});
		} else if (video.webkitSupportsPresentationMode && typeof video.webkitSetPresentationMode === 'function') {
			pipKnopf.addEventListener('click', () => {
				video.webkitSetPresentationMode(video.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
			});
		} else {
			pipKnopf.hidden = true;
		}

		// letzten Sender wiederherstellen
		const letzterSender = senderNamen.indexOf(speicher.lesen('teleweb-sender'));
		playTV(letzterSender >= 0 ? letzterSender : 0);
	</script>
</body>
